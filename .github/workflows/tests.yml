name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Installer syntax and CLI startup
        run: |
          sh -n install.sh
          python -I locker.py --help
          python -I locker.py --version

  kernel:
    name: Linux kernel enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Report test environment
        run: |
          uname -srmo
          /usr/bin/python3 --version
          findmnt -T "$RUNNER_TEMP" -o TARGET,FSTYPE
      - name: Verify immutable flags on disposable files
        run: sudo /usr/bin/python3 -I locker.py self-test --parent "$RUNNER_TEMP"
